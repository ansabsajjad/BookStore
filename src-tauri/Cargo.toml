[package]
name = "bookstore-manager"
version = "1.0.0"
description = "Bookstore Manager desktop app"
authors = ["Troon Technologies"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# tauri::generate_context! expands to code that calls into both of these,
# so they have to be direct dependencies even though nothing here names them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
