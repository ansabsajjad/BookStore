name: Release Windows app

# Pushing to main updates the WEBSITE only — Vercel watches the branch.
# The desktop app is built from a version tag, and nothing else:
#
#   git tag v1.0.1
#   git push origin v1.0.1
#
# That is the whole ritual. The version is taken from the tag and written into
# tauri.conf.json before the build, so there is no file to remember to edit —
# and no chance of shipping a release that every installed copy ignores because
# it announced itself as the version they already had.
#
# Installed copies check for a new release each time they start and update
# themselves, so nobody has to download an installer again.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.1'
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Must run before the build: this is what the installed app compares
      # against when it decides whether there is anything new to fetch.
      - name: Take the version from the tag
        shell: bash
        run: node scripts/sync-version.mjs "${{ github.event.inputs.version || github.ref_name }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install the Tauri CLI
        run: npm install

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          releaseName: 'Bookstore Manager ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: 'Installed copies update themselves the next time they start.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
